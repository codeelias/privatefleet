name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation package present
        run: |
          test -d docs
          test -f docs/README.md
          echo "Baseline documentation verified."
      # Future steps (activate when apps/ exists):
      # - lint -> typecheck -> unit -> integration -> build -> e2e

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm --filter @privatefleet/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
