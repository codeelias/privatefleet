name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation package present
        run: |
          test -d docs
          test -f docs/README.md
          echo "Baseline documentation verified."

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: privatefleet_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/privatefleet_dev
      TEST_DATABASE_URL: postgres://privatefleet_app:privatefleet_app_pw@127.0.0.1:5432/privatefleet_dev
      AUTH_JWT_SECRET: ci-only-jwt-secret-at-least-16-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - name: Enable PostGIS and create the non-owner app role
        run: |
          psql "postgres://postgres:postgres@127.0.0.1:5432/privatefleet_dev" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS postgis;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'privatefleet_app') THEN
              CREATE ROLE privatefleet_app LOGIN PASSWORD 'privatefleet_app_pw';
            END IF;
          END
          $$;
          GRANT USAGE ON SCHEMA public TO privatefleet_app;
          SQL
      - name: Apply migrations (owner role) and RLS policies
        run: pnpm --filter @privatefleet/api db:migrate
      - name: Integration tests (auth, RLS cross-tenant, lifecycle, idempotency)
        run: pnpm --filter @privatefleet/api test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm --filter @privatefleet/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
