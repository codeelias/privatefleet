plugins {
    id 'com.android.application'
}

android {
    namespace 'com.privatefleet.driver.nativeapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.privatefleet.driver.nativeapp"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "API_BASE", "\"https://pf-node.tail060a86.ts.net\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
